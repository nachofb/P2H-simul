services:
  - type: web
    name: p2h-simul
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run industrial_electrification/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
